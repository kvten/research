name: Run ytf default

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  run_ytfilter:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github
            ytfbin

      - name: Run application
        env:
          DB_URL: ${{ secrets.DB_URL }}
        run: chmod +x ./ytfbin && ./ytfbin

      - name: Finish
        run: |
          curl -X POST ${{ secrets.LOG }} \
            -H "Content-Type: application/json" \
            -d '{"program": "ytf_default", "level": "INFO", "message": "Scheduled run complete"}'
